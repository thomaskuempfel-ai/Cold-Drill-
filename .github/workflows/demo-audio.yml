name: demo-audio

# Records the sample call on the landing page (branch `landing`) with Gemini TTS and commits audio/ there.
# Needs the repository secret GEMINI_API_KEY (Settings > Secrets and variables > Actions).
on:
  workflow_dispatch:
    inputs:
      model:
        description: "TTS model(s), comma-separated (first that works is used)"
        type: string
        default: "gemini-2.5-flash-preview-tts,gemini-2.5-pro-preview-tts"

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: landing
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Record
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TTS_MODEL: ${{ inputs.model }}
        run: node scripts/tts.mjs
      - name: Commit audio
        run: |
          git config user.name "cold-drill-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "audio: sample call $(date -u +%Y-%m-%d)"
          git push origin HEAD:landing
