<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Warteliste in Zahlen · Cold Drill</title><meta name="robots" content="noindex"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono:wght@500&display=swap"><style>
:root{--bg:#F3F5F7;--surface:#fff;--ink:#11161D;--muted:#56606C;--line:#D9DEE4;--accent:#E8A317;--call:#1E7F63}
@media (prefers-color-scheme:dark){:root{--bg:#0E1318;--surface:#161D25;--ink:#E8EDF2;--muted:#9AA6B2;--line:#26303B;--accent:#F0B232;--call:#3DB38E;color-scheme:dark}}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 "IBM Plex Sans","Segoe UI",system-ui,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding-block:32px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2{font-family:"Bricolage Grotesque","Avenir Next","Segoe UI",sans-serif;line-height:1.1;text-wrap:balance}
h1{font-size:clamp(30px,5vw,44px);margin:18px 0 18px}h2{font-size:21px;margin:30px 0 8px}
a{color:inherit}.back{font:500 13px "IBM Plex Mono",ui-monospace,monospace;color:var(--muted)}
.todo{background:color-mix(in srgb,var(--accent) 22%,transparent);padding:1px 6px;border-radius:4px}
table{width:100%;border-collapse:collapse;font-size:15px}td,th{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}td.n{text-align:right;font:500 15px "IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.big{font:500 64px/1 "IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;min-width:0}
.muted{color:var(--muted)}
</style></head><body><div class="wrap"><a class="back" href="/">← Cold Drill</a>
<h1>Warteliste in Zahlen</h1>
<p class="muted">Nur Summen, keine Namen oder Adressen. Die einzelnen Einträge siehst du im Cloudflare-Dashboard unter Workers KV.</p>
<div class="grid" style="margin-top:22px"><div class="card"><div class="muted">Anmeldungen</div><div class="big" id="total">–</div></div><div class="card"><div class="muted">Letzte 7 Tage</div><div class="big" id="week">–</div></div></div>
<div id="tables" class="grid" style="margin-top:16px"></div>
<p class="muted" id="msg" style="margin-top:18px">Wird geladen …</p>
<script>
fetch("/api/stats",{cache:"no-store"}).then(function(r){return r.json()}).then(function(d){
 if(!d.ok){document.getElementById("msg").textContent="Die Warteliste ist noch nicht mit dem Speicher verbunden (KV-Bindung WAITLIST fehlt).";return}
 document.getElementById("total").textContent=d.total;
 var since=new Date(Date.now()-6*864e5).toISOString().slice(0,10),w=0;Object.keys(d.byDay).forEach(function(k){if(k>=since)w+=d.byDay[k]});
 document.getElementById("week").textContent=w;
 var T={pp:"Was wäre es dir wert?",br:"Branche",tm:"Teamgrösse",country:"Land"},box=document.getElementById("tables");
 Object.keys(T).forEach(function(f){var c=document.createElement("div");c.className="card";var h=document.createElement("h2");h.style.marginTop="0";h.textContent=T[f];c.appendChild(h);var t=document.createElement("table");
  Object.keys(d[f]).sort(function(a,b){return d[f][b]-d[f][a]}).forEach(function(k){var tr=t.insertRow(),a=tr.insertCell(),b=tr.insertCell();a.textContent=k;b.textContent=d[f][k];b.className="n"});c.appendChild(t);box.appendChild(c)});
 document.getElementById("msg").textContent="Stand: "+new Date().toLocaleString("de-CH");
}).catch(function(){document.getElementById("msg").textContent="Zahlen konnten nicht geladen werden."});
</script>
</div></body></html>
